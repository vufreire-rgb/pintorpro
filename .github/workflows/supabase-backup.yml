# Backup semanal do banco do Supabase (o plano Free não faz backup).
# Gera um dump SQL (dados do app + usuários), CRIPTOGRAFA com a senha BACKUP_PASSPHRASE e guarda 35 dias como "artefato".
# NÃO inclui fotos e áudios (Storage). Passo a passo e restauração: docs/BACKUP_E_PAUSA_SUPABASE.md.
# Secrets: SUPABASE_DB_URL (conexão "Session pooler") e BACKUP_PASSPHRASE.
name: Supabase backup
on:
  schedule:
    - cron: "23 6 * * 1" # toda segunda, 06:23 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confere os secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DB_URL" ] || { echo "Falta o secret SUPABASE_DB_URL"; exit 1; }
          [ -n "$PASS" ] || { echo "Falta o secret BACKUP_PASSPHRASE"; exit 1; }
      - name: Instala o cliente do Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Gera o backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges \
            --schema=public --table=auth.users --table=auth.identities --file=backup.sql
          [ -s backup.sql ]
      - name: Criptografa (AES-256) e apaga o arquivo aberto
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          out="medde-backup-$(date -u +%Y-%m-%d).sql.gpg"
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$out" backup.sql
          rm -f backup.sql
          ls -l medde-backup-*.sql.gpg
      - name: Guarda o backup criptografado
        uses: actions/upload-artifact@v4
        with:
          name: medde-backup
          path: medde-backup-*.sql.gpg
          retention-days: 35
          if-no-files-found: error
