# Mantém o projeto do Supabase (plano Free) acordado: uma consulta simples por dia.
# O Free pausa após 7 dias sem uso. Se esta tarefa falhar, o GitHub avisa por e-mail.
# Precisa do secret SUPABASE_PUBLISHABLE_KEY (a chave PÚBLICA "publishable"). Ver docs/BACKUP_E_PAUSA_SUPABASE.md.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 09:17 UTC
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consulta o banco (conta como atividade)
        env:
          SUPABASE_URL: https://dafelzfidqxuntvkkgrd.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then echo "Falta o secret SUPABASE_PUBLISHABLE_KEY"; exit 1; fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/user_data?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          [ "$code" = "200" ]
