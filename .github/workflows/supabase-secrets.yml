# Envia ao Supabase a chave da OpenAI (secret das funções), na mão: Actions → Supabase secrets → Run workflow.
# A chave fica guardada no GitHub (secret OPENAI_API_KEY) e vai direto ao Supabase: nunca passa pelo chat nem pelo código.
name: Supabase secrets (chave da OpenAI)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: dafelzfidqxuntvkkgrd

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Enviar OPENAI_API_KEY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN."; exit 1; fi
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::Falta o secret OPENAI_API_KEY no GitHub."; exit 1; fi
          supabase secrets set "OPENAI_API_KEY=$OPENAI_API_KEY" --project-ref "$PROJECT_REF"
          echo "Pronto: OPENAI_API_KEY enviada ao Supabase."
